<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Первый запуск</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/panel.css') }}">
</head>
<body class="setup-page">
  <div class="setup-card">
    <h1>Первый запуск</h1>
    <p>Создайте первого пользователя с ролью Super Admin.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="setup-messages" aria-live="polite">
          {% for category, message in messages %}
            <div class="setup-message setup-message-{{ category|e }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form method="post" aria-label="Создание первого суперадминистратора">
      <label>Логин
        <input type="text" name="login" minlength="3" value="{{ default_login or 'admin' }}" required>
      </label>
      <label>Роль
        <input type="text" value="{{ fixed_role or 'Super Admin' }}" readonly aria-readonly="true">
      </label>
      <label>Новый пароль
        <input type="password" name="password" minlength="6" required>
      </label>
      <label>Повторите пароль
        <input type="password" name="password2" minlength="6" required>
      </label>
      <button type="submit" class="btn-primary">Сохранить</button>
    </form>
  </div>
</body>
</html>
